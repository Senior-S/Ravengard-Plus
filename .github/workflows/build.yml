name: build

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  neoforge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: neoforge-26.1
            artifact: ravengard-plus-neoforge-mc26.1-26.1.2
          - project: neoforge
            artifact: ravengard-plus-neoforge-mc26.2
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./${{ matrix.project }}/gradlew
      - name: build
        run: ./${{ matrix.project }}/gradlew -p ${{ matrix.project }} build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.project }}/build/libs/ravengard-plus-*.jar
            !${{ matrix.project }}/build/libs/*-sources.jar

  modern-26-1:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew -p modern-26.1 build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ravengard-plus-mc26.1-26.1.2
          path: |
            modern-26.1/build/libs/ravengard-plus-*.jar
            !modern-26.1/build/libs/*-sources.jar

  modern:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ravengard-plus-mc26.2
          path: |
            build/libs/ravengard-plus-*.jar
            !build/libs/*-sources.jar

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [neoforge, modern-26-1, modern]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: publish version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          modern_26_1_version="$(sed -n 's/^mod_version=//p' modern-26.1/gradle.properties)"
          test -n "$version"
          for project in neoforge neoforge-26.1; do
            test "$version" = "$(sed -n 's/^mod_version=//p' "$project/gradle.properties")"
          done
          test "$version" = "$modern_26_1_version"
          tag="v$version"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          gh release create "$tag" release/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ravengard Plus $version" \
            --generate-notes
