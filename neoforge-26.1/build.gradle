	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = "${mod_version}+mc26.1-26.1.2-neoforge"

sourceSets.main.java.setSrcDirs(['../neoforge/src/main/java', '../common/src/main/java', '../common/src/26.1/java'])

apply from: '../gradle/neoforge.gradle'
